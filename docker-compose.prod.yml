# Hosted topology (Linux host with an NVIDIA GPU).
#
# Unlike the dev compose file, Ollama IS containerised here: GPU passthrough works on
# Linux via the NVIDIA Container Toolkit. The only thing that changes for application
# code is OLLAMA_BASE_URL. See plan/DECISIONS.md D-002.
#
# Phase 0 ships this as the skeleton it will grow from, so the hosting path is exercised
# from the start rather than invented in Phase 8 (spec §16). The backend and frontend
# services are added in Phase 8 along with their multi-stage images.

services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "/qdrant/qdrant", "--version"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-recitai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the deploy environment}
      POSTGRES_DB: ${POSTGRES_DB:-recitai}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-recitai}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  qdrant_storage:
  pg_data:
  ollama_models:
