# Hosted topology — one command, per spec §16's VERIFY.
#
#   cp .env.example .env && docker compose -f docker-compose.prod.yml up -d
#
# Unlike the dev compose file, Ollama IS containerised here: GPU passthrough works on
# Linux via the NVIDIA Container Toolkit, which it does not on macOS. The only thing
# application code sees is OLLAMA_BASE_URL (D-002 / ADR 0003).
#
# The target is a GCP demo deployment (D-014). Generation is a background job, so the GPU
# is bursty rather than latency-critical — on a scale-to-zero platform the ollama service
# below is replaced by a URL, and nothing else changes.

services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    restart: unless-stopped
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "/qdrant/qdrant", "--version"]
      interval: 15s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-recitai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the deploy environment}
      POSTGRES_DB: ${POSTGRES_DB:-recitai}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      # Authenticated, not pg_isready: pg_isready reports healthy without connecting as
      # the user, which once hid a database the application could not actually reach.
      test: ["CMD-SHELL", "psql -U ${POSTGRES_USER:-recitai} -d ${POSTGRES_DB:-recitai} -c 'SELECT 1' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Pulls the models once, then exits. Without this the first generation request blocks
  # on a 5.7 GB download with no indication of why.
  model-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "ollama pull ${GEN_MODEL:-llama3.1:8b-instruct-q5_K_M} &&
       ollama pull ${EMBEDDING_MODEL:-nomic-embed-text}"
    restart: "no"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      model-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-recitai}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-recitai}
      QDRANT_URL: http://qdrant:6333
      OLLAMA_BASE_URL: http://ollama:11434
      GEN_MODEL: ${GEN_MODEL:-llama3.1:8b-instruct-q5_K_M}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      LOG_FORMAT: json
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./scripts/entrypoint.sh:/app/entrypoint.sh:ro
    entrypoint: ["/app/entrypoint.sh"]
    ports:
      - "${API_PORT:-8000}:8000"

volumes:
  qdrant_storage:
  pg_data:
  ollama_models:
