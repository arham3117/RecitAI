# Development topology (macOS / Apple Silicon).
#
# Ollama is deliberately absent: Docker on macOS has no GPU passthrough, so a
# containerised model server would run CPU-only — roughly 10x slower, and it would make
# Phase 7's latency measurements meaningless. It runs natively on the host instead and
# is reached at http://localhost:11434. See plan/DECISIONS.md D-002.
#
# For the hosted topology (Linux + NVIDIA, Ollama containerised) see docker-compose.prod.yml.

services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # The qdrant image ships no curl/wget; its entrypoint binary answers this instead.
      test: ["CMD", "/qdrant/qdrant", "--version"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: recitai
      POSTGRES_PASSWORD: recitai
      POSTGRES_DB: recitai
    ports:
      # 5433 on the host: Homebrew postgresql@14 owns 5432 and shadows this container on
      # localhost. See plan/ISSUES.md I-020. Container-internal port is unchanged.
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      # pg_isready does NOT authenticate — it reported healthy while every real
      # connection failed. Run an actual authenticated query instead (I-020).
      test: ["CMD-SHELL", "psql -U recitai -d recitai -c 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  qdrant_storage:
  pg_data:
